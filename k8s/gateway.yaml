apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hackathon-judge-gateway
  namespace: hackathon-judge
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hackathon-judge-route
  namespace: hackathon-judge
spec:
  parentRefs:
  - name: hackathon-judge-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 80
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: backend-health-check
  namespace: hackathon-judge
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /api/hackathons
  targetRef:
    group: ""
    kind: Service
    name: backend

apiVersion: agents.x-k8s.io/v1alpha1
kind: Sandbox
metadata:
  name: gemini-sandbox
  namespace: hackathon-judge
spec:
  podTemplate:
    metadata:
      labels:
        sandbox: gemini-sandbox
    spec:
      containers:
        - name: gemini-sandbox
          image: "${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REPO_NAME}/backend:$COMMIT_SHA"
          securityContext:
            allowPrivilegeEscalation: false
          ports:
          - containerPort: 8888
          resources:
            limits:
              memory: "4Gi"
              cpu: "2000m"
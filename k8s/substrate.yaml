apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: judge-workerpool
  namespace: hackathon-judge
  labels:
    workload: hackathon-judge
spec:
  replicas: 3
  workerImage: "${SUBSTRATE_WORKER_IMAGE}"
  sandboxClasses:
  - name: gvisor
  template:
    labels:
      workload: hackathon-judge
    resources:
      # ateworker-gvisor reserves 64 MiB per worker pod from limits.memory, so
      # 4608Mi provides 512Mi (>= 64Mi) headroom above the 4Gi (4096Mi) Judge Actor limit.
      limits:
        cpu: "2000m"
        memory: "4608Mi"
      requests:
        cpu: "1000m"
        memory: "4608Mi"
---
apiVersion: ate.dev/v1
kind: ActorTemplate
metadata:
  name: judge-sandbox
  namespace: hackathon-judge
  atespace: hackathon-judge
workerSelector:
  matchLabels:
    workload: hackathon-judge
trustBundles:
- egress-mitm.ate.dev
- system-roots.ate.dev
containers:
- name: hackathon-judge
  image: "${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REPO_NAME}/agent-sandbox:$COMMIT_SHA"
  env:
  - name: HOME
    value: "/home/sandbox"
  - name: GOOGLE_CLOUD_PROJECT
    value: "${GOOGLE_CLOUD_PROJECT}"
  - name: GOOGLE_CLOUD_LOCATION
    value: "global"
  - name: SANDBOX_DIR
    value: "/home/sandbox/app"
  - name: MODEL_PROXY_BASE_URL
    value: "http://agent.hackathon-judge.svc.cluster.local:8000/vertex-proxy"
  - name: VERTEX_PROXY_URL
    value: "http://agent.hackathon-judge.svc.cluster.local:8000/vertex-proxy"
  - name: JUDGE_MODEL
    value: ""
  - name: SSL_CERT_FILE
    value: "/run/ate/trust-bundle.pem"
  - name: REQUESTS_CA_BUNDLE
    value: "/run/ate/trust-bundle.pem"
  - name: CURL_CA_BUNDLE
    value: "/run/ate/trust-bundle.pem"
  - name: GIT_SSL_CAINFO
    value: "/run/ate/trust-bundle.pem"
  - name: NODE_EXTRA_CA_CERTS
    value: "/run/ate/trust-bundle.pem"
  volumeMounts:
  - name: system-info
    mountPath: /run/ate
  wakeupProbe:
    httpGet:
      path: /health
      port: 8888
volumes:
- name: system-info
  systemInfo:
    dataSources:
    - trustBundle:
        names:
        - egress-mitm.ate.dev
        - system-roots.ate.dev
        path: trust-bundle.pem
resources:
  limits:
    cpuMillicores: 2000
    memoryBytes: 4294967296
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY

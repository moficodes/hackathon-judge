<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Neighing Unicorn -->
  <path d="M 30,80 Q 25,60 40,40 Q 60,40 70,60 Q 75,80 60,80 Z" fill="#ffb6c1"/> <!-- Body -->
  <path d="M 40,40 Q 20,15 45,15 Q 60,20 60,40 Z" fill="#ffb6c1"/> <!-- Head reared back -->
  <polygon points="40,15 35,0 48,12" fill="#ffd700"/> <!-- Horn angled -->
  <circle cx="48" cy="25" r="3" fill="black"/> <!-- Eye wide -->
  <path d="M 30,35 Q 25,30 20,35 Q 25,40 30,35" fill="#8b0000"/> <!-- Mouth open loudly neighing -->
  <!-- Sparkles -->
  <circle cx="20" cy="20" r="2" fill="#fff"/>
  <circle cx="80" cy="30" r="2" fill="#fff"/>
  <circle cx="70" cy="70" r="2" fill="#fff"/>
</svg>

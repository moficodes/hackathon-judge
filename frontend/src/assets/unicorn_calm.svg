<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Calm Unicorn -->
  <path d="M 30,80 Q 25,60 40,40 Q 60,40 70,60 Q 75,80 60,80 Z" fill="#ffb6c1"/> <!-- Body -->
  <path d="M 40,40 Q 30,20 45,20 Q 55,20 60,40 Z" fill="#ffb6c1"/> <!-- Head -->
  <polygon points="45,20 50,5 55,20" fill="#ffd700"/> <!-- Horn -->
  <circle cx="45" cy="30" r="2" fill="black"/> <!-- Eye closed/calm -->
  <path d="M 43,30 Q 45,32 47,30" fill="none" stroke="black" stroke-width="1"/> <!-- Calm eye detail -->
  <!-- Sparkles -->
  <circle cx="20" cy="20" r="1" fill="#fff"/>
  <circle cx="80" cy="30" r="1" fill="#fff"/>
  <circle cx="70" cy="70" r="1" fill="#fff"/>
</svg>
